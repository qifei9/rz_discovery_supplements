      3end: meta/tailing_polyA_adapter_R2_3end.fasta
    reads_renamed: 1 # boolean
    strand_as_R1: 1 # boolean
  oligo_ligation:
    R1:
      5end: meta/ligation_adapter_R1_5end.fasta
      3end: meta/ligation_adapter_R1_3end.fasta
      3end_se: null
    R2:
      5end: meta/ligation_adapter_R2_5end.fasta
      3end: meta/ligation_adapter_R2_3end.fasta
    reads_renamed: 1 # boolean
    strand_as_R1: 1 # boolean
