threads: 100
params:
  mapQ: 42
dir:
  raw: ../../demo/01_processing # NOTE: folder for the raw sequencing data
  qc: QC
  results:
    fq: results/01.fq
    bam: results/02.bam
    bedpe: results/03.bedpe
    bed: results/04.bed
  log: logs
adapters:
  spikeins20: meta/separate_spikeins20.fasta
  tailing_polyC:
    R1:
      5end: meta/tailing_polyC_adapter_R1_5end.fasta
      3end: meta/tailing_polyC_adapter_R1_3end.fasta
      3end_se: null
    R2:
      5end: meta/tailing_polyC_adapter_R2_5end.fasta
      3end: meta/tailing_polyC_adapter_R2_3end.fasta
    reads_renamed: 1 # boolean
    strand_as_R1: 1 # boolean
  tailing_polyA:
